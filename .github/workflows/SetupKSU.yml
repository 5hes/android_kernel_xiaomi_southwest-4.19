name: Setup SukiSU-Ultra builtin and SUSFS

on:
  workflow_dispatch:

permissions: write-all

jobs:
  Setup:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup KSU and SUSFS
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
        git clone --depth 1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git

    - name: rename subdir .git to .git.bak
      run: |
        mv KernelSU/.git KernelSU/.git.bak
        mv susfs4ksu/.git susfs4ksu/.git.bak

    - name: Integrate KSU and SUSFS to repo
      run: |
        git config user.name "actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Setup SukiSU-Ultra builtin and SUSFS"
        git push
