name: build kernel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc git flex bison libssl-dev libncurses5-dev libelf-dev
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-mainline-release/clang-r383902.tar.gz
          mkdir ~/.aosp-clang
          tar -xzf clang-r383902.tar.gz -C ~/.aosp-clang

      - name: Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=~/.aosp-clang
          export PATH=$CLANG_PATH/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          
          make clover_defconfig
          make -j$(nproc) \
          O=out \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          KBUILD_CFLAGS="-Wno-error"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          path: out
